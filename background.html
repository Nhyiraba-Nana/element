<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        body{
            background-image: url("https://images.unsplash.com/photo-1682685790910-1f3e7c8d5b9e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8YmFja2dyb3VuZCUyMGltYWdlfGVufDB8fDB8fA%3D%3D&w=1000&q=80");
        }
        h2{
            color:black;
        }
        p{
            color:brown;
        }
        /** class selector **/
        .h2{
            background-color:burlywood;
        }
        .p2{
            background-color:beige;
            
        }

        /** id selector **/
        #h2{
            height: 150px;
            width: 250px;
            background-image: radial-gradient(pink, coral, purple);

        }
        #p1{
            background-image: radial-gradient(to right, purple, coral);
        }
    </style>
</head>
<body>
    <h2 id="h2">my first heading</h2>
        <h2 class="h2">my first heading</h2>

        <p id="p1">paragraph1</p>
        <p class="p2">paragraph2</p>
        <p>paragraph3</p>
        <p>paragraph4</p>
        <p>paragraph5</p>

</body>
</html>
